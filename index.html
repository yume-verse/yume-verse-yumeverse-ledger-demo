<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yumeverse 夢次元記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: 跟 iOS App 一樣 — 窄螢幕底部分頁、寬螢幕左側欄；彈出畫面從下方滑出。
   App 本身只有淺色版，這裡刻意維持同一套淺色配色（不跟系統深色）。 */
:root{
  --cream:#FBF5EA; --card:#FFFFFF; --ink:#3B322C; --ink-soft:#7A6F66; --line:#E8DCCB;
  --pink:#E8477F; --pink-deep:#C42A62; --pink-light:#F9C8DB; --pink-pale:#FDEDF3;
  --green:#7FA03F; --green-deep:#5A7A2C; --green-pale:#EDF2DC;
  --blue:#79B0DC; --blue-deep:#376C95; --blue-pale:#E9F4FC;
  --orange:#F3A23F; --orange-deep:#A95D1E; --orange-pale:#FFF1DD;
  --danger:#C65353; --danger-pale:#FBE7E7; --gray:#9A918A; --gray-pale:#F1ECE6;
  --line-pay:#00A64F; --shadow:rgba(146,104,76,.10); --scrim:rgba(59,50,44,.38);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius:18px; --tap:52px;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink-light);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* ===== Shell ===== */
.shell{min-height:100%}
.shell.wide{display:flex}
.main{flex:1;min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--cream) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.topbar-in{display:flex;align-items:center;gap:8px;min-height:56px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:1040px;margin:0 auto}
.topbar h1{font-size:22px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--pink-deep);flex:none}
.icon-btn:hover:not(:disabled){background:var(--pink-pale)}
.icon-btn:disabled{opacity:.3}
.back-btn{display:flex;align-items:center;gap:2px;color:var(--pink);font-weight:800;min-height:44px;padding-right:6px;flex:none}
.page{max-width:1040px;margin:0 auto;padding-block:8px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.page.narrowcol{max-width:780px}
.shell.wide .page{padding-bottom:60px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:11px;font-weight:800;color:var(--gray);position:relative;min-height:54px}
.tab.on{color:var(--pink)}
.tab .bdg{position:absolute;top:3px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:11px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

.sidebar{width:264px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;gap:4px}
.brand{font-weight:900;font-size:24px;color:var(--pink);padding:4px 10px 10px}
.brand small{display:block;font-size:13px;color:var(--ink-soft);font-weight:800}
.side-group{font-size:12px;font-weight:800;color:var(--ink-soft);padding:12px 10px 4px;letter-spacing:.04em}
.side-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;font-weight:800;font-size:16px;min-height:46px}
.side-item:hover{background:var(--cream)}
.side-item.on{background:var(--pink-pale);color:var(--pink-deep)}
.side-item .bdg{margin-left:auto;background:var(--pink);color:#fff;font-size:12px;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;background:var(--cream);border-radius:14px}

/* ===== Building blocks ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 12px var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.p8{padding:8px}.card.p10{padding:10px}.card.p24{padding:24px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.g8{gap:8px}.stack.g16{gap:16px}.stack.g20{gap:20px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.g8{gap:8px}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:-2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.soft{color:var(--ink-soft)}
.cap{font-size:12px}.sub{font-size:14px}.bold{font-weight:800}.heavy{font-weight:900}
.t-title{font-size:20px;font-weight:900}.t-big{font-size:24px;font-weight:900}
.divider{height:1px;background:var(--line);border:0;margin:0}
.center{text-align:center;align-items:center}
.stitle{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;color:var(--t,var(--ink));flex:1;min-width:0}
.stitle .count{font-size:13px;color:#fff;background:var(--t,var(--ink));border-radius:10px;padding:1px 8px}
.stitle .count.zero{background:var(--gray)}
.link{font-weight:800;color:var(--pink);font-size:14px;min-height:36px;display:inline-flex;align-items:center}
.empty{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-weight:700;font-size:14px;padding:6px 0}
.empty .ic{color:var(--green)}
.info{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14px}
.info span{color:var(--ink-soft)}
.info b{font-weight:800;text-align:right;overflow-wrap:anywhere}
.notice{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--ink-soft)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);border-radius:999px;padding:0 18px;font-weight:900;font-size:17px;width:100%;transition:transform .1s, box-shadow .1s}
.btn.primary{background:var(--b,var(--pink));color:#fff;box-shadow:0 4px 0 var(--bs,var(--pink-deep))}
.btn.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--bs,var(--pink-deep))}
.btn.primary:disabled{background:rgba(154,145,138,.55);box-shadow:none}
.btn.secondary{background:#fff;border:1.5px solid var(--line);color:var(--b,var(--ink));font-weight:800}
.btn.secondary:disabled{opacity:.5}
.btn.green{--b:var(--green);--bs:var(--green-deep)}
.btn.blue{--b:var(--blue);--bs:var(--blue-deep)}
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;font-weight:900;font-size:14px;background:var(--b,var(--pink));color:#fff;flex:none}
.cbtn.ghost{background:color-mix(in srgb,var(--b,var(--pink)) 12%,transparent);color:var(--b,var(--pink))}
.cbtn.green{--b:var(--green-deep)}
.cbtn:disabled{opacity:.5}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-weight:900;font-size:14px;flex:none;white-space:nowrap}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip .n{opacity:.75}
.coser-chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:900;font-size:14px;flex:none;white-space:nowrap}
.coser-chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.seg{display:flex;background:var(--gray-pale);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:800;font-size:14px;color:var(--ink-soft);text-align:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-weight:800;font-size:14px}
.input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-weight:700;font-size:16px}
.input.bad{border-color:var(--danger)}
.input.cream{background:var(--cream);border-color:transparent}
.input.big{min-height:56px;font-size:24px;font-weight:900}
textarea.input{padding:12px 14px;min-height:84px;resize:vertical}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.search .input{padding-left:40px;min-height:46px;background:var(--gray-pale);border-color:transparent}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:4px 9px;border-radius:999px;color:var(--fg);background:var(--bg);white-space:nowrap;flex:none}
.pill{display:inline-flex;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--ink-soft);background:var(--gray-pale);padding:5px 9px;border-radius:999px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.tile{border-radius:16px;padding:14px;background:var(--bg,#fff);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.tile .tl{font-size:14px;font-weight:900;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tv{font-size:24px;font-weight:900;color:var(--fg,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mtile{border-radius:14px;padding:12px;background:var(--bg,var(--cream));display:flex;flex-direction:column;gap:6px;min-width:0}
.mtile .tl{font-size:12px;font-weight:800;color:var(--ink-soft)}
.mtile .tv{font-size:19px;font-weight:900;color:var(--fg,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.todo{display:flex;align-items:center;gap:12px;padding:10px;min-height:56px;border-radius:14px;background:var(--cream);width:100%}
.todo .tic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg);background:color-mix(in srgb,var(--fg) 12%,transparent);flex:none}
.todo b{display:block;font-size:16px}
.bar{height:8px;border-radius:4px;background:var(--gray-pale);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--fg)}

.avatar{display:grid;place-items:center;font-weight:900;flex:none}
.photo{position:relative;display:grid;place-items:center;overflow:hidden;flex:none}
.photo .pin{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;opacity:.85}
.photo .corner{position:absolute;top:8px;left:8px}
.photo .corner-r{position:absolute;top:6px;right:6px}

.costume-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.ccard.on{background:var(--pink-pale);border:2.5px solid var(--pink);padding:8.5px}
.ccard .nm{font-weight:900;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .sb{font-weight:700;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loan-row,.sale-row,.venue-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-width:0}
.sale-row{align-items:flex-start}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg);background:color-mix(in srgb,var(--fg) 10%,transparent);flex:none}

.series{background:#fff;border:2px solid var(--tint);border-radius:var(--radius);overflow:hidden;min-width:0}
.series-h{background:var(--tint);color:var(--tink);padding:12px 14px;display:flex;align-items:center;gap:10px}
.series-h .w{font-size:12px;font-weight:800;opacity:.85}
.series-h .c{font-size:19px;font-weight:900}
.series-h .cnt{font-size:12px;font-weight:900;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--tink) 15%,transparent)}
.series-b{padding:0 10px 6px}
.kind{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;padding:8px 6px 2px;border-left:3px solid var(--tint);margin-top:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 6px;min-width:0}
.prow+.prow{border-top:1px solid var(--line)}
.qbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;flex:none}
.qbtn:disabled{background:rgba(154,145,138,.4)}
.qbtn.minus{width:40px;height:40px;background:var(--gray-pale);color:var(--ink)}
.series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.schip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--tint);background:#fff;font-weight:900;font-size:14px;flex:none;white-space:nowrap}
.schip i{width:14px;height:14px;border-radius:50%;background:var(--tint);border:1px solid var(--line)}
.schip.on{background:var(--tint);color:var(--tink)}
.schip.on i{border-color:transparent}

.checkout-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.cart-panel{position:sticky;top:72px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 96px);overflow:auto}
.cartbar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:25;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--cream) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cartbar .btn{justify-content:space-between;max-width:740px;margin:0 auto}
.cartbar .n{padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.25)}

.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybtn{display:flex;align-items:center;gap:10px;padding:14px;min-height:60px;border-radius:16px;font-weight:900;font-size:14px;color:var(--fg);background:color-mix(in srgb,var(--fg) 10%,transparent)}
.paybtn.on{background:var(--fg);color:#fff}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:110px;border-radius:20px;color:#fff;font-weight:900;font-size:17px;background:var(--b)}
.venue-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.venue-pick button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:72px;border-radius:16px;background:#fff;border:1.5px solid var(--line);font-weight:900;font-size:14px}
.venue-pick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:54px;border-radius:12px;background:#fff;border:1.5px solid var(--line);text-align:center}
.slot b{font-size:14px;font-weight:900}.slot span{font-size:11px;font-weight:800}
.slot.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.slot:disabled{background:var(--gray-pale);border-color:transparent;color:rgba(122,111,102,.6)}
.daychip{width:64px;height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.daychip span{font-size:12px;font-weight:800}.daychip b{font-size:14px;font-weight:900}
.daychip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.stepno{width:26px;height:26px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.steps{display:flex;gap:6px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--pink)}
.cond{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cond button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border-radius:16px;font-weight:900;font-size:14px;color:var(--fg);background:color-mix(in srgb,var(--fg) 10%,transparent);border:1.5px solid color-mix(in srgb,var(--fg) 40%,transparent)}
.cond button.on{background:var(--fg);color:#fff;border-color:transparent}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;justify-items:center;padding:4px 0}
.palette button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;outline-offset:3px}
.palette button.on{outline:3px solid var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px}
.switch .knob{width:51px;height:31px;border-radius:16px;background:var(--gray-pale);position:relative;flex:none;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked="true"] .knob{background:var(--pink)}
.switch[aria-checked="true"] .knob::after{left:22px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;font-weight:700}
.cal{display:flex;flex-direction:column;gap:8px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:900}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g .wd{font-size:12px;font-weight:800;color:var(--ink-soft);padding:4px 0}
.cal-g button{height:42px;border-radius:12px;font-weight:800;font-variant-numeric:tabular-nums}
.cal-g button:hover:not(:disabled){background:var(--pink-pale)}
.cal-g button.today{color:var(--pink);font-weight:900}
.cal-g button.on{background:var(--pink);color:#fff}
.cal-g button:disabled{color:rgba(122,111,102,.35)}
.daypick{display:flex;gap:8px;align-items:stretch}
.daypick .arrow{width:44px;min-height:56px;border-radius:14px;background:var(--pink-pale);color:var(--pink-deep);display:grid;place-items:center;flex:none}
.daypick .arrow:disabled{opacity:.4}
.daypick .mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:56px;border-radius:16px;background:#fff;border:1.5px solid var(--line)}
.notToday{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--orange-pale);color:var(--orange-deep);font-size:12px;font-weight:800}
.timeline{display:flex;gap:12px;align-items:flex-start}
.timeline .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.qr{background:#fff;border-radius:18px;padding:12px;width:244px;max-width:100%;align-self:center}
.qr svg{width:100%;height:auto;display:block}
.success{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px 0}
.success .mark{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;color:#fff;background:var(--b,var(--green))}
.demo{display:flex;align-items:center;gap:12px;padding:12px;min-height:64px;border-radius:16px;background:var(--cream);width:100%;text-align:left}
.demo:hover{background:var(--pink-pale)}
.proto{border:1.5px dashed var(--pink-light);background:var(--pink-pale);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--ink)}

/* ===== Sheets / dialogs / toast ===== */
.backdrop{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{background:var(--cream);width:100%;max-width:660px;height:calc(100% - 28px - env(safe-area-inset-top,0px));border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.15);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet.short{height:auto;max-height:calc(100% - 28px - env(safe-area-inset-top,0px))}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:54px;padding:0 10px;border-bottom:1px solid var(--line);background:#fff;flex:none}
.sheet-h h2{font-size:17px;font-weight:900;text-align:center}
.sheet-h .l{justify-self:start}.sheet-h .r{justify-self:end}
.sheet-h .tb{color:var(--pink);font-weight:800;min-height:44px;padding:0 8px}
.sheet-h .tb:disabled{opacity:.4}
.sheet-b{flex:1;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.sheet-b>*{flex-shrink:0}
.sheet-f{flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--cream) 90%,transparent);border-top:1px solid var(--line)}
@media (min-width:900px){
  .backdrop{align-items:center}
  .sheet{border-radius:22px;height:auto;max-height:88vh}
  .sheet .sheet-b{min-height:200px}
  .sheet.tall{height:88vh}
}
.dialog-wrap{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fade .15s}
.dialog{width:100%;max-width:440px;display:flex;flex-direction:column;gap:8px;animation:up .2s}
.dialog .box{background:#fff;border-radius:16px;overflow:hidden}
.dialog .q{padding:16px;text-align:center;font-size:14px;font-weight:800;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.dialog .q small{display:block;font-weight:600;margin-top:4px}
.dialog .opt{display:block;width:100%;min-height:54px;font-size:17px;font-weight:800;color:var(--blue-deep);text-align:center}
.dialog .opt+.opt{border-top:1px solid var(--line)}
.dialog .opt.danger{color:var(--danger)}
.dialog .cancel{background:#fff;border-radius:16px;min-height:56px;font-size:17px;font-weight:900;color:var(--blue-deep);text-align:center;width:100%}
@media (min-width:900px){.dialog-wrap{align-items:center}}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;color:#fff;padding:14px 18px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 6px 14px rgba(0,0,0,.18);width:max-content;max-width:min(520px,calc(100% - 32px));animation:drop .25s cubic-bezier(.2,.8,.2,1)}
.toast.t-success{background:var(--green-deep)}.toast.t-failure{background:var(--danger);border-radius:20px}.toast.t-info{background:var(--ink)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.daypick .chev{display:none}.daypick .mid{gap:8px;padding:6px 10px}.paygrid{grid-template-columns:1fr 1fr}.tile .tv{font-size:21px}.topbar h1{font-size:20px}}
.fb-item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.fb-item p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}

      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

/** 把 Notion「借用細項」拆成可以勾選的配件；括號裡「無／缺／不含」開頭的是本來就沒有的 */
function parseItems(raw) {
  raw = (raw || '').trim();
  if (!raw) return { items: [], remarks: [] };
  const parts = []; let cur = '', depth = 0;
  for (const ch of raw) {
    if (ch === '(' || ch === '（') depth++;
    if ((ch === ')' || ch === '）') && depth > 0) depth--;
    if ((ch === '+' || ch === '＋') && depth === 0) { parts.push(cur); cur = ''; } else cur += ch;
  }
  parts.push(cur);
  const items = [], remarks = [];
  for (const part of parts) {
    let text = '', group = '', opener = '(', level = 0;
    for (const ch of part) {
      if (ch === '(' || ch === '（') { if (level === 0) { group = ''; opener = ch; } else group += ch; level++; }
      else if ((ch === ')' || ch === '）') && level > 0) {
        level--;
        if (level === 0) {
          const c = group.trim();
          if (/^(無|缺|不含)/.test(c)) { remarks.push(c); text += ' '; }
          else text += opener === '（' ? `（${c}）` : `(${c})`;
        } else group += ch;
      } else if (level > 0) group += ch; else text += ch;
    }
    if (level > 0) text += opener + group;
    const item = text.split(' ').filter(Boolean).join(' ').replace(/^[\s\-－、,，]+|[\s\-－、,，]+$/g, '');
    if (item) items.push(item);
  }
  return { items, remarks };
}

      tintHex: LOCATION_TINT[trimOrNull(location)] || 'E8DCCB', suspended: false, suspendReason: null
    };
  });
}

  let h = `<aside class="sidebar"><div class="brand">Yumeverse<small>夢次元記帳・網頁測試版</small></div>`;
  for (const g of groups) {
    h += `<div class="side-group">${g}</div>`;

      h += `<button class="side-item${U.section === s ? ' on' : ''}"${act('tab', s)}><span style="color:var(--pink)">${icon(SEC_ICON[s], 22)}</span>${esc(secTitle(s))}${b ? `<span class="bdg">${b}</span>` : ''}</button>`;
    }
  }

    h += `<div class="side-group">快速動作</div><button class="side-item" style="color:var(--pink)"${act('openLend')}>${icon('shirt', 22)}預約服裝</button><button class="side-item" style="color:var(--blue-deep)"${act('openVenue')}>${icon('aperture', 22)}預約場地</button>`;
  }

  h += `<div class="side-foot"><span class="avatar" style="width:38px;height:38px;border-radius:12px;background:var(--pink);color:#fff;font-size:17px">${esc(initial)}</span><div class="grow"><div class="heavy sub ellip">${esc(u.displayName)}</div><div class="cap soft">${isCompany() ? '公司' : 'Coser'}帳號</div></div></div></aside>`;

function entryTitle(e) {
  if (!e) return secTitle(U.section);
  if (e.type === 'section') return secTitle(e.section);
  if (e.type === 'costume') return costumeByID(e.id)?.code ?? '服裝';
  if (e.type === 'loan') return '借用明細';
  if (e.type === 'member') return '會員';
  return '';
}
function currentContent() {
  const top = U.stack[U.stack.length - 1];
  let r;
  if (!top) r = sectionView(U.section);
  else if (top.type === 'section') r = sectionView(top.section);
  else if (top.type === 'costume') r = viewCostumeDetail(top.id);
  else if (top.type === 'loan') r = viewLoanDetail(top.id);
  else r = viewMemberDetail(top.id);
  r.key = top ? `${top.type}-${top.id || top.section}` : U.section;
  if (top) r.backLabel = entryTitle(U.stack[U.stack.length - 2]);
  return r;
}
function sectionView(s) {
  switch (s) {
    case 'home': return isCompany() ? viewCompanyHome() : viewCoserHome();
    case 'checkout': return viewCheckout();
    case 'reconcile': return viewReconcile();
    case 'costumes': return viewCostumes();
    case 'records': return viewRecords();
    case 'bookings': return viewBookings();
    case 'inventory': return viewProducts();
    case 'mySales': return viewSalesHistory();
    case 'members': return viewMembers();
    default: return viewMore();
  }
}
function viewShell() {
  const wide = isWide(); const c = currentContent();
  const back = U.stack.length ? `<button class="back-btn"${act('back')}>${icon('chevron-left', 24, 3)}<span class="ellip" style="max-width:110px">${esc(c.backLabel)}</span></button>` : '';
  const fb = FB.db ? `<button class="icon-btn"${act('openFeedback')} aria-label="意見回饋" title="意見回饋">${icon('message-square-text', 22)}</button>` : '';
  return `<div class="shell ${wide ? 'wide' : 'narrow'}">${wide ? sidebar() : ''}<div class="main"><header class="topbar"><div class="topbar-in">${back}<h1>${esc(c.title)}</h1>${c.right || ''}${fb}</div></header><main class="page ${c.cls || ''}" id="pg-${esc(c.key)}">${c.html}</main></div></div>${wide ? '' : tabbar()}${c.after || ''}`;

const todoRow = (ic, t, d, fg) => `<span class="todo" style="--fg:${fg}"><span class="tic">${icon(ic, 20)}</span><span class="grow" style="text-align:left"><b>${esc(t)}</b><span class="cap soft">${esc(d)}</span></span><span class="soft">${icon('chevron-right', 16, 3)}</span></span>`;
function paymentBreakdown(s) {
  const rows = [['現金', s.byMethod.cash || 0, PAY.cash.fg], ['轉帳', s.byMethod.transfer || 0, PAY.transfer.fg], ['LINE Pay', s.byMethod.linePay || 0, PAY.linePay.fg]];
  if ((s.byMethod.recorded || 0) > 0) rows.push(['現場表已收（方式未記）', s.byMethod.recorded, PAY.recorded.fg]);
  rows.push(['賒帳待收', s.outstanding, PAY.credit.fg]);
  const total = Math.max(1, rows.reduce((n, r) => n + r[1], 0));
  return stitle('收款方式') + rows.map(([t, a, fg]) => `<div class="stack" style="gap:4px"><div class="row"><span class="grow bold sub">${esc(t)}</span><b class="sub num">${money(a, s.currency)}</b></div><div class="bar" style="--fg:${fg}"><i style="width:${a === 0 ? 0 : Math.max(2, a / total * 100)}%"></i></div></div>`).join('');
}

  let vt, vfg, vbg;
  if (s.variance == null) { vt = s.expectedCash == null ? '輸入起始現金和實點後，自動算差額' : '輸入收攤實點後，自動算差額'; vfg = 'var(--ink-soft)'; vbg = 'var(--gray-pale)'; }
  else { vt = s.variance === 0 ? '✓ 現金完全相符' : s.variance > 0 ? `多 ${m(s.variance)}` : `少 ${m(-s.variance)}`; vfg = s.variance === 0 ? 'var(--green-deep)' : 'var(--orange-deep)'; vbg = s.variance === 0 ? 'var(--green-pale)' : 'var(--orange-pale)'; }

  for (const k of ['cash', 'transfer', 'linePay', 'recorded']) if (k !== 'recorded' || (s.byMethod.recorded || 0) > 0) tiles.push(mtile(PAY[k].label, m(s.byMethod[k] || 0), PAY[k].fg));
  tiles.push(mtile('當天待收', m(s.outstanding), s.outstanding > 0 ? 'var(--orange-deep)' : 'var(--ink)', s.outstanding > 0 ? 'var(--orange-pale)' : 'var(--cream)'));

    card(stitle(isToday() ? '今天收入' : '當天收入') + `<div class="tiles" style="gap:10px">${tiles.join('')}</div>` +
      (s.currency === 'HKD' ? `<div class="notice">${icon('info', 14)}這天是香港場的舊資料，金額是港幣。</div>` : '') +

// ----- 預約服裝（3 步驟） -----
function lendDates(sh) {
  const t = today();
  const start = sh.startOpt === 'today' ? t : sh.startOpt === 'tomorrow' ? addDays(t, 1) : maxS(t, sh.customStart);
  const n = { threeDays: 3, oneWeek: 7, twoWeeks: 14 }[sh.lenOpt];
  const due = n != null ? addDays(start, n) : maxS(start, sh.customDue);
  return { start, due };
}
function periodSummary(start, due) {
  const res = diffDays(today(), start) > 0; const n = diffDays(start, due) + 1;
  return `<div class="stack g8"><div class="row"><span class="grow sub soft">借用</span><b style="font-size:17px">${esc(dayText(start))}</b></div><div class="row"><span class="grow sub soft">歸還</span><b style="font-size:17px;color:var(--pink-deep)">${esc(dayText(due))}</b></div><div class="cap bold" style="color:${res ? 'var(--blue-deep)' : 'var(--green-deep)'}">${res ? `共 ${n} 天・這是預約，到借用日才算借出` : `共 ${n} 天・今天就借出`}</div></div>`;

const md = k => { const d = dayDate(k); return `${d.getMonth() + 1}/${d.getDate()}`; };

    + `<div class="field"><label for="f-sheet-event">活動名稱（選填）</label>${inp('sheet.event', { ph: '例如 FF45' })}</div>`
    + card(`<b style="font-size:17px">請確認</b>${periodSummary(start, due)}${HR}${info('借用人', [name, sh.renterPhone.trim()].filter(Boolean).join('・'))}${info('服裝', `${sel.length} 套`)}`)

// ----- 預約場地 -----
function qrSvg(text) {
  try {
    if (!window.qrcode) throw 0;
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    const q = qrcode(0, 'M'); q.addData(text, 'Byte'); q.make();
    return q.createSvgTag({ cellSize: 6, margin: 0 });
  } catch (e) { return `<div class="stack center soft" style="padding:30px 0">${icon('qr-code', 120, 1.5)}<span class="cap">QR code 載入失敗</span></div>`; }
}
function venueInfo(b) {
  const v = VENUES[b.venue];
  return (v.qr && vActive(b) ? `<div class="qr" role="img" aria-label="預約 QR code">${qrSvg(vPayload(b))}</div><div class="cap soft" style="text-align:center">QR code 內容：預約編號、場地和時間（用途之後再決定）</div>` : '')
    + card(`${info('預約編號', b.id)}${info('場地', v.label)}${info('日期', dayText(b.day))}${info('時間', `${vTime(b)}（${b.endHour - b.startHour} 小時）`)}${b.note ? info('備註', b.note) : ''}${!vActive(b) ? info('狀態', '已取消', 'var(--danger)') : ''}`);
}
function sheetVenue(sh) {
  if (sh.done) {
    const b = venueBooking(sh.done);
    const body = `<div class="success" style="padding-bottom:0"><span class="mark">${icon('check', 40, 3)}</span><div class="t-big" style="font-size:28px">預約成功</div></div>` + venueInfo(b);
    return sheetFrame({ title: '預約成功', body, footer: btn('完成', 'closeSheet', null, { ic: 'check' }) });
  }
  const t = today();
  const days = Array.from({ length: 14 }, (_, i) => addDays(t, i));
  const dayChips = days.map(d => { const dd = dayDate(d); const title = d === t ? '今天' : d === addDays(t, 1) ? '明天' : WEEK[dd.getDay()]; return `<button class="daychip${sh.day === d ? ' on' : ''}"${act('vDay', d)} aria-pressed="${sh.day === d}"><span>${title}</span><b>${dd.getMonth() + 1}/${dd.getDate()}</b></button>`; }).join('');
  const slots = [];
  for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++) {

  if (p.priceTWD == null) return show('failure', `「${p.name}」還沒有台幣售價，請先到「我的商品」填上售價。`);

  lendStartPick(d) { U.sheet.customStart = d; },
  lendStartMonth(n) { U.sheet.startMonth = shiftMonth(U.sheet.startMonth, +n); },
  lendLen(o) { const sh = U.sheet; sh.lenOpt = o; if (o === 'custom') { const { start } = lendDates({ ...sh, lenOpt: 'oneWeek' }); if (sh.customDue < start) sh.customDue = addDays(start, 7); sh.dueMonth = sh.customDue.slice(0, 7); } },
  lendDuePick(d) { U.sheet.customDue = d; },
  lendDueMonth(n) { U.sheet.dueMonth = shiftMonth(U.sheet.dueMonth, +n); },
  lendNext() {
    const sh = U.sheet;
    if (sh.step === 1) { const { start, due } = lendDates(sh); const ok = new Set(availableCostumes(start, due).map(c => c.id)); sh.selected = sh.selected.filter(id => ok.has(id)); sh.step = 2; }
    else if (sh.step === 2 && sh.selected.length) sh.step = 3;
  },
  lendBack() { U.sheet.step = Math.max(1, U.sheet.step - 1); },
  lendToggle(id) { const s = U.sheet.selected; const i = s.indexOf(id); if (i >= 0) s.splice(i, 1); else s.push(id); },
  lendRenter(i) { const r = recentRenters(U.user)[+i]; if (r) { U.sheet.renterName = r.name; U.sheet.renterPhone = r.phone || ''; } },
  lendPurpose(p) { U.sheet.purpose = p; },
  doLend() {
    const sh = U.sheet; const { start, due } = lendDates(sh);
    const what = sh.selected.length === 1 ? costumeDisplay(costumeByID(sh.selected[0])) : `${sh.selected.length} 套服裝`;
    const msg = diffDays(today(), start) > 0 ? `已預約 ${what}（${dayText(start)} 開始）` : `已登記借用 ${what}`;
    if (perform(() => lend(sh.selected, { name: sh.renterName, phone: sh.renterPhone }, start, due, { purpose: sh.purpose, event: sh.event }, U.user), msg)) U.sheet = null;
  },

  // 歸還、取消、恢復
  openReturn(id) { U.sheet = { type: 'return', loanID: id, checked: [], condition: null, note: '' }; },
  retCheck(i) { const sh = U.sheet; const c = costumeByID(loanByID(sh.loanID).costumeID); const a = c.accessories[+i]; const k = sh.checked.indexOf(a); if (k >= 0) sh.checked.splice(k, 1); else sh.checked.push(a); },
  retCond(k) {
    const sh = U.sheet; sh.condition = k;
    if (k === 'missingParts' && !sh.note) { const c = costumeByID(loanByID(sh.loanID).costumeID); const miss = c.accessories.filter(a => !sh.checked.includes(a)); if (sh.checked.length && miss.length) sh.note = '缺少：' + miss.join('、'); }
    if (k !== 'normal') focusAfter = 'f-sheet-note';
  },
  doReturn() { const sh = U.sheet; if (perform(() => confirmReturn(sh.loanID, sh.condition, sh.note, U.user), sh.condition === 'normal' ? '歸還完成，服裝可以再借用' : '歸還完成，服裝已暫停借用，整理好再恢復')) U.sheet = null; },
  askCancelLoan(id) { ask('確定要取消這筆服裝預約嗎？', null, [{ label: '取消預約', danger: true, run: () => perform(() => cancelLoan(id, U.user), '已取消預約') }], '不要'); },
  askResume(cid) { ask('確定這套服裝已整理好、可以再借用了嗎？', null, [{ label: '確定，恢復可借用', run: () => perform(() => resumeLending(cid, U.user), '已恢復可借用') }], '還沒有'); },

  // 預約場地
  openVenue() { U.sheet = { type: 'venue', day: today(), venue: 'studioA', start: null, end: null, note: '', done: null }; },
  vDay(d) { Object.assign(U.sheet, { day: d, start: null, end: null }); },
  vVenue(v) { Object.assign(U.sheet, { venue: v, start: null, end: null }); },
  vSlot(h) {
    const sh = U.sheet; h = +h;
    if (sh.start == null) { sh.start = h; sh.end = h + 1; return; }
    if (h >= sh.start && venueFree(sh.venue, sh.day, sh.start, h + 1)) sh.end = h + 1; else { sh.start = h; sh.end = h + 1; }
  },
  doVenue() { const sh = U.sheet; const b = perform(() => bookVenue(sh.venue, sh.day, sh.start, sh.end, sh.note, U.user)); if (b) sh.done = b.id; },
  askCancelVenue(id) { const b = venueBooking(id); ask(`確定要取消 ${VENUES[b.venue].label} ${dayText(b.day)} ${vTime(b)} 嗎？`, null, [{ label: '取消預約', danger: true, run: () => { if (perform(() => cancelVenue(id, U.user), '已取消場地預約')) U.sheet = null; } }], '不要'); },

  // 商品
  openProduct(pid, tid) { openProductForm(pid, tid); },
  pfSeries(id) { U.sheet.seriesID = id; },
  pfTint(h) { U.sheet.newTint = h; },
  pfKind(k) { U.sheet.kind = k; if (k === 'goods') U.sheet.digital = false; },
  pfDigital() { U.sheet.digital = !U.sheet.digital; },
  pfSave() { const sh = U.sheet; const d = productDraft(sh); if (!d) return; const n = d.name.trim(); if (perform(() => saveProduct(d, sh.productID, U.user), sh.productID ? `已更新「${n}」` : `已新增「${n}」`)) U.sheet = null; },
  pfDiscontinue() { const p = productByID(U.sheet.productID); const to = !p.discontinued; if (perform(() => { ownProduct(p.id, U.user).discontinued = to; }, to ? `「${p.name}」已停售` : `「${p.name}」恢復販售`)) U.sheet = null; },
  askDeleteProduct() { const p = productByID(U.sheet.productID); ask(`確定要刪除「${p.name}」嗎？`, '刪除後找不回來。過去的交易紀錄不受影響。', [{ label: '刪除', danger: true, run: () => { if (perform(() => { ownProduct(p.id, U.user); SB().products.splice(SB().products.indexOf(p), 1); }, `已刪除「${p.name}」`)) U.sheet = null; } }], '不要'); },
  resumeSale(id) { const p = productByID(id); perform(() => { ownProduct(id, U.user).discontinued = false; }, `「${p.name}」恢復販售`); },
  openRestock(id) { U.sheet = { type: 'restock', productID: id, text: '' }; },
  rsAdd(n) { U.sheet.text = String(parseInt(U.sheet.text || '0', 10) + +n); },
  doRestock() { const sh = U.sheet; const add = parseInt(sh.text || '0', 10); const p = productByID(sh.productID); const after = (p.stock ?? 0) + add; if (add > 0 && perform(() => { ownProduct(p.id, U.user).stock = after; }, `「${p.name}」進貨 ${add} 件，現在 ${after} 件`)) U.sheet = null; },
  openCount(id) { const p = productByID(id); U.sheet = { type: 'count', productID: id, text: p.stock != null ? String(p.stock) : '' }; },
  cntStep(n) { U.sheet.text = String(Math.max(0, parseInt(U.sheet.text || '0', 10) + +n)); },
  doCount() { const sh = U.sheet; const n = parseInt(sh.text, 10); const p = productByID(sh.productID); if (!(n >= 0)) return; if (perform(() => { ownProduct(p.id, U.user).stock = n; }, `已更新「${p.name}」庫存為 ${n} 件`)) U.sheet = null; },
  openSeries(id) { const t = themeByID(id); U.sheet = { type: 'series', themeID: id, work: t.work, character: t.character, tint: t.tintHex }; },
  sfTint(h) { U.sheet.tint = h; },
  saveSeries() { const sh = U.sheet; if (perform(() => updateTheme(sh.themeID, sh.work, sh.character, sh.tint, U.user), '已更新作品・角色')) U.sheet = null; },
  askDeleteSeries() { const t = themeByID(U.sheet.themeID); ask(`確定要刪除「${themeName(t)}」嗎？`, null, [{ label: '刪除', danger: true, run: () => { if (perform(() => deleteTheme(t.id, U.user), `已刪除「${themeName(t)}」`)) U.sheet = null; } }], '不要'); },

  // 會員
  toggleMemberCard() { const on = !memberCardOn(); if (on) SB().memberCard.add(U.user.coserID); else SB().memberCard.delete(U.user.coserID); show('success', on ? '已打開會員卡，「會員」在「更多」裡' : '已關閉會員卡，會員資料會保留'); if (!on && U.stack.some(e => e.section === 'members')) U.stack = []; },
  openMember(id) { const m = id ? SB().members.find(x => x.id === id) : null; U.sheet = { type: 'member', memberID: m?.id ?? null, fanID: m?.fanID ?? '', nickname: m?.nickname ?? '', note: m?.note ?? '' }; },
  saveMember() { const sh = U.sheet; const ok = sh.memberID ? perform(() => updateMember(sh.memberID, sh.nickname, sh.note, U.user), '已更新會員資料') : perform(() => addMember(sh.fanID, sh.nickname, sh.note, U.user), `已新增會員 ${normalizeFan(sh.fanID)}`); if (ok) U.sheet = null; },

  // 意見回饋
  openFeedback() { U.sheet = { type: 'feedback', text: '', sending: false, sent: false, error: null }; },
  sendFeedback() {
    const sh = U.sheet; const text = sh.text.trim(); if (!text || !FB.db) return;
    sh.sending = true; sh.error = null; sh.sent = false;
    const screen = U.user ? `${currentContent().title}・${U.user.displayName}` : '登入畫面';
    FB.db.collection('feedback').add({ text: text.slice(0, 2000), screen, dataset: U.dataset, wide: isWide(), at: new Date().toISOString() })
      .then(() => { if (U.sheet === sh) { sh.text = ''; sh.sent = true; } })
      .catch(err => { if (U.sheet === sh) sh.error = err?.code === 'invalid_argument' ? '這個連結沒有留言權限，請直接把意見傳給巧。' : '送出失敗，請稍後再試一次。'; })
      .finally(() => { sh.sending = false; render(); });
  }
};

// ================= 畫面更新 =================
const APP = document.getElementById('app');
let composing = false, focusAfter = null;
function render() {
  const html = (U.user ? viewShell() : viewLogin()) + (U.sheet ? viewSheet() : '') + (U.confirm ? viewConfirm() : '')
    + (U.toast ? `<div class="toast t-${U.toast.kind}" id="toast-${U.toast.id}" role="status"${act('toastClose')}>${icon(U.toast.kind === 'success' ? 'circle-check' : U.toast.kind === 'failure' ? 'circle-x' : 'info', 22, 2.4)}<span>${esc(U.toast.text)}</span></div>` : '');
  if (window.morphdom) {
    morphdom(APP, `<div id="app">${html}</div>`, {
      onBeforeElUpdated(from, to) {
        if (from === document.activeElement && (from.tagName === 'INPUT' || from.tagName === 'TEXTAREA')) { from.className = to.className; return false; }
        return !from.isEqualNode(to);
      }
    });
  } else APP.innerHTML = html;
  document.body.classList.toggle('lock', !!(U.sheet || U.confirm));
  if (wantScrollTop) { wantScrollTop = false; window.scrollTo(0, 0); }
  if (focusAfter) { const el = document.getElementById(focusAfter); focusAfter = null; if (el) el.focus(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const name = el.dataset.a;
  if (name === 'noop') return;
  if (el.tagName === 'BUTTON') e.preventDefault();
  e.stopPropagation();
  const fn = A[name]; if (!fn) return;
  fn(el.dataset.p, el.dataset.q);
  render();
});
document.addEventListener('compositionstart', () => { composing = true; });
document.addEventListener('compositionend', e => { composing = false; onInput(e); });
function onInput(e) {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  let v = el.value;
  if (el.dataset.num) { const d = v.replace(/\D/g, ''); if (d !== v) { el.value = d; v = d; } }
  setBind(el.dataset.bind, v);
  if (el.dataset.bind.startsWith('login.')) U.login.error = null;
  if (U.sheet?.type === 'feedback') U.sheet.sent = false;
  if (!composing) render();
}
document.addEventListener('input', onInput);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (U.confirm) U.confirm = null; else if (U.sheet) U.sheet = null; else return; render(); return; }
  if (e.key === 'Enter' && !e.isComposing && e.target.dataset?.enter) { e.preventDefault(); A[e.target.dataset.enter](); render(); }
});
window.matchMedia('(min-width: 900px)').addEventListener('change', render);
// 跨日、時段過期：每分鐘重畫一次（沒有開彈出畫面時）
setInterval(() => { if (!U.sheet && !document.activeElement?.dataset?.bind) render(); }, 60000);

resetData(U.dataset);
render();

// 意見回饋：有共用資料庫時才出現
(async () => {
  try {
    const db = await window.claude?.use?.('db');
    if (!db) return;
    FB.db = db;
    db.collection('feedback').orderBy('at', 'desc').limit(50).onSnapshot(snap => { FB.items = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
    render();
  } catch (e) { /* 沒有回饋功能也可以正常使用 */ }
})();

</script>
</body>
</html>
