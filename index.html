<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yumeverse 夢次元記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: 跟 iOS App 一樣 — 窄螢幕底部分頁、寬螢幕左側欄；彈出畫面從下方滑出。
   App 本身只有淺色版，這裡刻意維持同一套淺色配色（不跟系統深色）。 */
:root{
  --cream:#FBF5EA; --card:#FFFFFF; --ink:#3B322C; --ink-soft:#7A6F66; --line:#E8DCCB;
  --pink:#E8477F; --pink-deep:#C42A62; --pink-light:#F9C8DB; --pink-pale:#FDEDF3;
  --green:#7FA03F; --green-deep:#5A7A2C; --green-pale:#EDF2DC;
  --blue:#79B0DC; --blue-deep:#376C95; --blue-pale:#E9F4FC;
  --orange:#F3A23F; --orange-deep:#A95D1E; --orange-pale:#FFF1DD;
  --danger:#C65353; --danger-pale:#FBE7E7; --gray:#9A918A; --gray-pale:#F1ECE6;
  --line-pay:#00A64F; --shadow:rgba(146,104,76,.10); --scrim:rgba(59,50,44,.38);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --radius:18px; --tap:52px;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink-light);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.ic{flex:none;display:inline-block;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}

/* ===== Shell ===== */
.shell{min-height:100%}
.shell.wide{display:flex}
.main{flex:1;min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--cream) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.topbar-in{display:flex;align-items:center;gap:8px;min-height:56px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));max-width:1040px;margin:0 auto}
.topbar h1{font-size:22px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--pink-deep);flex:none}
.icon-btn:hover:not(:disabled){background:var(--pink-pale)}
.icon-btn:disabled{opacity:.3}
.back-btn{display:flex;align-items:center;gap:2px;color:var(--pink);font-weight:800;min-height:44px;padding-right:6px;flex:none}
.page{max-width:1040px;margin:0 auto;padding-block:8px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.page.narrowcol{max-width:780px}
.shell.wide .page{padding-bottom:60px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:11px;font-weight:800;color:var(--gray);position:relative;min-height:54px}
.tab.on{color:var(--pink)}
.tab .bdg{position:absolute;top:3px;left:calc(50% + 6px);background:var(--danger);color:#fff;font-size:11px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

.sidebar{width:264px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 12px;gap:4px}
.brand{font-weight:900;font-size:24px;color:var(--pink);padding:4px 10px 10px}
.brand small{display:block;font-size:13px;color:var(--ink-soft);font-weight:800}
.side-group{font-size:12px;font-weight:800;color:var(--ink-soft);padding:12px 10px 4px;letter-spacing:.04em}
.side-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;font-weight:800;font-size:16px;min-height:46px}
.side-item:hover{background:var(--cream)}
.side-item.on{background:var(--pink-pale);color:var(--pink-deep)}
.side-item .bdg{margin-left:auto;background:var(--pink);color:#fff;font-size:12px;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;background:var(--cream);border-radius:14px}

/* ===== Building blocks ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 12px var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.p8{padding:8px}.card.p10{padding:10px}.card.p24{padding:24px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.g8{gap:8px}.stack.g16{gap:16px}.stack.g20{gap:20px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.g8{gap:8px}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:-2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.soft{color:var(--ink-soft)}
.cap{font-size:12px}.sub{font-size:14px}.bold{font-weight:800}.heavy{font-weight:900}
.t-title{font-size:20px;font-weight:900}.t-big{font-size:24px;font-weight:900}
.divider{height:1px;background:var(--line);border:0;margin:0}
.center{text-align:center;align-items:center}
.stitle{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;color:var(--t,var(--ink));flex:1;min-width:0}
.stitle .count{font-size:13px;color:#fff;background:var(--t,var(--ink));border-radius:10px;padding:1px 8px}
.stitle .count.zero{background:var(--gray)}
.link{font-weight:800;color:var(--pink);font-size:14px;min-height:36px;display:inline-flex;align-items:center}
.empty{display:flex;align-items:center;gap:12px;color:var(--ink-soft);font-weight:700;font-size:14px;padding:6px 0}
.empty .ic{color:var(--green)}
.info{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:14px}
.info span{color:var(--ink-soft)}
.info b{font-weight:800;text-align:right;overflow-wrap:anywhere}
.notice{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--ink-soft)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);border-radius:999px;padding:0 18px;font-weight:900;font-size:17px;width:100%;transition:transform .1s, box-shadow .1s}
.btn.primary{background:var(--b,var(--pink));color:#fff;box-shadow:0 4px 0 var(--bs,var(--pink-deep))}
.btn.primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--bs,var(--pink-deep))}
.btn.primary:disabled{background:rgba(154,145,138,.55);box-shadow:none}
.btn.secondary{background:#fff;border:1.5px solid var(--line);color:var(--b,var(--ink));font-weight:800}
.btn.secondary:disabled{opacity:.5}
.btn.green{--b:var(--green);--bs:var(--green-deep)}
.btn.blue{--b:var(--blue);--bs:var(--blue-deep)}
.cbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;font-weight:900;font-size:14px;background:var(--b,var(--pink));color:#fff;flex:none}
.cbtn.ghost{background:color-mix(in srgb,var(--b,var(--pink)) 12%,transparent);color:var(--b,var(--pink))}
.cbtn.green{--b:var(--green-deep)}
.cbtn:disabled{opacity:.5}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-weight:900;font-size:14px;flex:none;white-space:nowrap}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip .n{opacity:.75}
.coser-chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:900;font-size:14px;flex:none;white-space:nowrap}
.coser-chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.seg{display:flex;background:var(--gray-pale);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:800;font-size:14px;color:var(--ink-soft);text-align:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-weight:800;font-size:14px}
.input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;font-weight:700;font-size:16px}
.input.bad{border-color:var(--danger)}
.input.cream{background:var(--cream);border-color:transparent}
.input.big{min-height:56px;font-size:24px;font-weight:900}
textarea.input{padding:12px 14px;min-height:84px;resize:vertical}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.search .input{padding-left:40px;min-height:46px;background:var(--gray-pale);border-color:transparent}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:4px 9px;border-radius:999px;color:var(--fg);background:var(--bg);white-space:nowrap;flex:none}
.pill{display:inline-flex;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--ink-soft);background:var(--gray-pale);padding:5px 9px;border-radius:999px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px}
.tile{border-radius:16px;padding:14px;background:var(--bg,#fff);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.tile .tl{font-size:14px;font-weight:900;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tv{font-size:24px;font-weight:900;color:var(--fg,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mtile{border-radius:14px;padding:12px;background:var(--bg,var(--cream));display:flex;flex-direction:column;gap:6px;min-width:0}
.mtile .tl{font-size:12px;font-weight:800;color:var(--ink-soft)}
.mtile .tv{font-size:19px;font-weight:900;color:var(--fg,var(--ink));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.todo{display:flex;align-items:center;gap:12px;padding:10px;min-height:56px;border-radius:14px;background:var(--cream);width:100%}
.todo .tic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg);background:color-mix(in srgb,var(--fg) 12%,transparent);flex:none}
.todo b{display:block;font-size:16px}
.bar{height:8px;border-radius:4px;background:var(--gray-pale);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--fg)}

.avatar{display:grid;place-items:center;font-weight:900;flex:none}
.photo{position:relative;display:grid;place-items:center;overflow:hidden;flex:none}
.photo .pin{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;opacity:.85}
.photo .corner{position:absolute;top:8px;left:8px}
.photo .corner-r{position:absolute;top:6px;right:6px}

.costume-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.ccard.on{background:var(--pink-pale);border:2.5px solid var(--pink);padding:8.5px}
.ccard .nm{font-weight:900;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard .sb{font-weight:700;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loan-row,.sale-row,.venue-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-width:0}
.sale-row{align-items:flex-start}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg);background:color-mix(in srgb,var(--fg) 10%,transparent);flex:none}

.series{background:#fff;border:2px solid var(--tint);border-radius:var(--radius);overflow:hidden;min-width:0}
.series-h{background:var(--tint);color:var(--tink);padding:12px 14px;display:flex;align-items:center;gap:10px}
.series-h .w{font-size:12px;font-weight:800;opacity:.85}
.series-h .c{font-size:19px;font-weight:900}
.series-h .cnt{font-size:12px;font-weight:900;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--tink) 15%,transparent)}
.series-b{padding:0 10px 6px}
.kind{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;padding:8px 6px 2px;border-left:3px solid var(--tint);margin-top:6px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 6px;min-width:0}
.prow+.prow{border-top:1px solid var(--line)}
.qbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;flex:none}
.qbtn:disabled{background:rgba(154,145,138,.4)}
.qbtn.minus{width:40px;height:40px;background:var(--gray-pale);color:var(--ink)}
.series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px;align-items:start}
.schip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--tint);background:#fff;font-weight:900;font-size:14px;flex:none;white-space:nowrap}
.schip i{width:14px;height:14px;border-radius:50%;background:var(--tint);border:1px solid var(--line)}
.schip.on{background:var(--tint);color:var(--tink)}
.schip.on i{border-color:transparent}

.checkout-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;position:relative}
.checkout-grid.nocart{grid-template-columns:minmax(0,1fr)}
@keyframes cartIn{from{transform:translateX(60px);opacity:0}}
@keyframes barUp{from{transform:translateY(24px);opacity:0}}
.checkout-grid .cart-panel{animation:cartIn .36s cubic-bezier(.2,.8,.2,1)}
.cart-panel.leaving{position:absolute;right:0;pointer-events:none}
.cartbar{animation:barUp .28s cubic-bezier(.2,.8,.2,1)}
.cart-panel{position:sticky;top:72px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 96px);overflow:auto}
.page.fullw{max-width:none}
.shell.wide .topbar-in{max-width:none}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.shell.wide .tile-grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.ptile-wrap{position:relative;min-width:0}
.ptile{width:100%;height:96px;border-radius:12px;overflow:hidden;background:var(--pbg);display:flex;flex-direction:column;text-align:left;transition:transform .1s, opacity .1s}
.shell.wide .ptile{height:124px}
.ptile:active:not(:disabled){transform:scale(.95);opacity:.85}
/* 有加入的格子：深色外框畫在外層，才不會被商品照蓋住 */
.ptile-wrap.has::after{content:'';position:absolute;inset:0;border-radius:12px;box-shadow:inset 0 0 0 3px var(--ink);pointer-events:none}
/* 格子底色鋪 80% 的商品照；品名那一塊用作品顏色漸層蓋住，字才看得清楚；不能賣的轉灰階再淡一點 */
.ptile{position:relative}
.ptile.ph::before{content:'';position:absolute;inset:0;background:var(--photo) center/cover no-repeat;opacity:.8;pointer-events:none}
.ptile.ph::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,color-mix(in srgb,var(--pbg) 85%,transparent) 0%,color-mix(in srgb,var(--pbg) 50%,transparent) 35%,transparent 70%)}
.ptile.ph:disabled::before{filter:grayscale(1);opacity:.25}
.ptile .pn,.ptile .pb{position:relative;z-index:1}
.ptile .pn{flex:1;padding:10px 10px 0;font-weight:900;font-size:15px;line-height:1.25;color:var(--pink-on);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shell.wide .ptile .pn{font-size:20px}
.ptile.has .pn{padding-right:40px}
.ptile .pb{height:30px;flex:none;background:var(--pbar);color:var(--pbar-on);display:flex;align-items:center;gap:4px;padding:0 10px;font-size:14px;min-width:0}
.shell.wide .ptile .pb{height:36px;font-size:17px}
.ptile .pb i{font-style:normal;font-size:.8em;font-weight:900;white-space:nowrap}
.ptile .pb b{margin-left:auto;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.pbadge{position:absolute;top:5px;right:5px;min-width:34px;height:34px;border-radius:17px;background:var(--ink);color:#fff;font-weight:900;font-size:17px;border:2px solid #fff;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.cday{display:flex;align-items:center;gap:6px;min-width:0}
.carrow{width:40px;height:40px;border-radius:50%;background:var(--pink-pale);color:var(--pink-deep);display:grid;place-items:center;flex:none}
.carrow:disabled{opacity:.4}
.cmid{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px;min-width:0;white-space:nowrap;overflow:hidden}
.cmid b{font-weight:900;overflow:hidden;text-overflow:ellipsis}
.cmid .lbl{color:var(--pink-deep);font-weight:800;overflow:hidden;text-overflow:ellipsis}
.cmid.past{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-deep)}
.cmid.cur{background:var(--pink-pale);border-color:var(--pink);color:var(--pink-deep)}
.cday > .cmid:first-child{flex:1 1 auto}
.cmid.curbtn{flex:none}
.pricegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.curopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.curopts button{min-height:64px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-weight:900;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.curopts button.on{background:var(--pink);border-color:var(--pink);color:#fff}
.curopts button span{font-size:13px;font-weight:800;opacity:.8}
.pages{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.cpage{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.cpage img{width:96px;height:128px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--gray-pale)}
.cpage .del{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.social{padding:12px;border-radius:14px;background:var(--cream);display:flex;flex-direction:column;gap:8px}
.select{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font-weight:800;font-size:15px;color:var(--ink)}
.cartbar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:25;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--cream) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/** 把 Notion「借用細項」拆成可以勾選的配件；括號裡「無／缺／不含」開頭的是本來就沒有的 */
function parseItems(raw) {
  raw = (raw || '').trim();
  if (!raw) return { items: [], remarks: [] };
  const parts = []; let cur = '', depth = 0;
  for (const ch of raw) {
    if (ch === '(' || ch === '（') depth++;
    if ((ch === ')' || ch === '）') && depth > 0) depth--;
    if ((ch === '+' || ch === '＋') && depth === 0) { parts.push(cur); cur = ''; } else cur += ch;
  }
  parts.push(cur);
  const items = [], remarks = [];
  for (const part of parts) {
    let text = '', group = '', opener = '(', level = 0;
    for (const ch of part) {
      if (ch === '(' || ch === '（') { if (level === 0) { group = ''; opener = ch; } else group += ch; level++; }
      else if ((ch === ')' || ch === '）') && level > 0) {
        level--;
        if (level === 0) {
          const c = group.trim();
          if (/^(無|缺|不含)/.test(c)) { remarks.push(c); text += ' '; }
          else text += opener === '（' ? `（${c}）` : `(${c})`;
        } else group += ch;
      } else if (level > 0) group += ch; else text += ch;
    }
    if (level > 0) text += opener + group;
    const item = text.split(' ').filter(Boolean).join(' ').replace(/^[\s\-－、,，]+|[\s\-－、,，]+$/g, '');
    if (item) items.push(item);
  }
  return { items, remarks };
}

function validateRegistration(f, user) {
  if (user.role !== 'company') fail('只有公司帳號可以登記 Coser。');
  const cosName = (f.cosName || '').trim(), realName = (f.realName || '').trim(), planNote = (f.planNote || '').trim();
  const account = (f.account || '').trim().toLowerCase();
  if (!cosName) fail('請填 Cos 名。');
  if (!realName) fail('請填本名。');
  if (!f.plan) fail('請選方案。');
  if (f.plan === '特殊方案' && !planNote) fail('特殊方案請寫方案內容。');
  if (!f.contractDate || !dayDate(f.contractDate)) fail('請選簽約日期。');
  const nonNeg = v => v === '' || v == null || /^\d+$/.test(String(v));
  if (!nonNeg(f.igFollowers)) fail('粉絲數請填 0 以上的整數。');
  const socials = [];
  for (const so of f.socials || []) {
    const handle = (so.handle || '').trim();
    if (!handle) fail('社群帳號沒填，請填上帳號或刪掉這一列。');
    if (!nonNeg(so.followers)) fail('粉絲數請填 0 以上的整數。');
    const name = so.platform === '其他' ? (trimOrNull(so.custom) || '其他') : so.platform;
    socials.push({ platform: name, handle, followers: so.followers === '' || so.followers == null ? null : Number(so.followers) });
  }
  if (!isValidAccount(account)) fail('登入帳號請用 3–20 個英文小寫、數字、底線或減號，英文開頭（例如 momo_cos）。');
  if (takenIDs().has(account)) fail(`「${account}」已經有人用了，請換一個帳號。`);
  if ((f.password || '').length < MIN_PASSWORD) fail(`密碼至少 ${MIN_PASSWORD} 個字。`);
  return { cosName, realName, plan: f.plan, planNote: planNote || null, contractDate: f.contractDate, igAccount: trimOrNull(f.igAccount),
    igFollowers: f.igFollowers === '' || f.igFollowers == null ? null : Number(f.igFollowers), socials, account, password: f.password };
}
// ①先建名冊資料與 App 用的 Coser（CoserID＝帳號）②再建登入帳號；帳號沒建成功資料會留著，可以重試
function registerCoser(f, user) {
  const v = validateRegistration(f, user);
  const used = new Set(COSERS.map(c => c.colorHex));
  SB().newCosers.push({ id: v.account, name: v.cosName, shortName: v.cosName, initial: [...v.cosName][0] || 'C', colorHex: PALETTE.find(h => !used.has(h)) || PALETTE[COSERS.length % PALETTE.length] });
  syncPeople();
  const profile = { id: v.account, cosName: v.cosName, realName: v.realName, plan: v.plan, planNote: v.planNote, contractDate: v.contractDate,
    igAccount: v.igAccount, igFollowers: v.igFollowers, socials: v.socials,
    photos: (f.photos || []).map((src, i) => ({ id: `${v.account}-${nowMs().toString(36)}-${i + 1}`, page: i + 1, src })),
    hasLogin: false, createdAt: nowMs(), createdBy: user.id };
  SB().roster.push(profile);
  createLogin(profile.id, v.password, user);
  return profile;
}
function createLogin(id, password, user) {
  if (user.role !== 'company') fail('只有公司帳號可以建立登入帳號。');
  const r = rosterProfile(id); if (!r) fail('名冊裡找不到這位 Coser。');
  if ((password || '').length < MIN_PASSWORD) fail(`密碼至少 ${MIN_PASSWORD} 個字。`);
  if (ACCOUNTS.some(a => a.id === id)) fail(`Coser 資料已建立，但登入帳號沒建成功：「${id}」已經有人用了。`);
  SB().newAccounts.push({ id, displayName: r.cosName, role: 'coser', coserID: id, password, hint: '公司登記的新 Coser（這次測試新建）' });
  syncPeople();
  r.hasLogin = true;
}
function addContractPhotos(id, srcs, user) {
  if (user.role !== 'company') fail('只有公司帳號可以登記 Coser。');
  const r = rosterProfile(id); if (!r) fail('名冊裡找不到這位 Coser。');
  let last = r.photos.reduce((m, x) => Math.max(m, x.page), 0);
  for (const src of srcs) r.photos.push({ id: `${id}-${nowMs().toString(36)}-${++last}`, page: last, src });
}
function removeContractPhoto(id, photoID, user) {
  if (user.role !== 'company') fail('只有公司帳號可以登記 Coser。');
  const r = rosterProfile(id); if (!r) fail('名冊裡找不到這位 Coser。');
  r.photos = r.photos.filter(x => x.id !== photoID).sort((a, b) => a.page - b.page).map((x, i) => ({ ...x, page: i + 1 }));

const WD_SHORT = ['日', '一', '二', '三', '四', '五', '六'];
function shiftMonth(mk, n) { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function monthGrid(month, selected, min, max, pickAct, navAct) {
  const [y, m] = month.split('-').map(Number);
  const startW = new Date(y, m - 1, 1).getDay(); const daysIn = new Date(y, m, 0).getDate(); const t = today();
  let cells = WD_SHORT.map(w => `<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(startW);
  for (let d = 1; d <= daysIn; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`; const dis = (min && k < min) || (max && k > max);
    cells += `<button class="${k === selected ? 'on' : ''}${k === t ? ' today' : ''}"${act(pickAct, k)}${dis ? ' disabled' : ''} aria-label="${esc(dayText(k))}">${d}</button>`;

  return `<div class="cal card p10"><div class="cal-h"><button class="icon-btn"${act(navAct, -1)}${prevDis ? ' disabled' : ''} aria-label="上個月">${icon('chevron-left', 20, 3)}</button><span>${y}年${m}月</span><button class="icon-btn"${act(navAct, 1)}${nextDis ? ' disabled' : ''} aria-label="下個月">${icon('chevron-right', 20, 3)}</button></div><div class="cal-g">${cells}</div></div>`;
}

/** 預約用月曆：被借走的日子反灰加刪除線、選的區間標粉紅、有預約的日子加藍點 */
function calGrid({ month, min, max, picked = [], range = null, blocked = null, dots = null, pick, nav, idPrefix = 'calday' }) {
  const [y, m] = month.split('-').map(Number);
  const startW = new Date(y, m - 1, 1).getDay(); const daysIn = new Date(y, m, 0).getDate(); const t = today();
  let cells = WD_SHORT.map(w => `<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(startW);
  for (let d = 1; d <= daysIn; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`;
    const out = (min && k < min) || (max && k > max);
    const isBlocked = !out && blocked && blocked.has(k);
    const on = picked.includes(k);
    const inRange = !on && range && range[0] && range[1] && k > range[0] && k < range[1];
    const cls = [on ? 'on' : '', k === t ? 'today' : '', isBlocked ? 'blocked' : '', inRange ? 'inrange' : ''].filter(Boolean).join(' ');
    const label = `${dayText(k)}${isBlocked ? '，已經被借走' : ''}${dots && dots.has(k) ? '，有人預約' : ''}`;
    cells += `<button id="${idPrefix}-${k}" class="${cls}"${act(pick, k)}${out || isBlocked ? ' disabled' : ''} aria-label="${esc(label)}" aria-pressed="${on}"><span>${d}</span>${dots && dots.has(k) ? '<i class="dot"></i>' : ''}</button>`;
  }
  const prevDis = min && month <= min.slice(0, 7), nextDis = max && month >= max.slice(0, 7);
  return `<div class="cal card p10"><div class="cal-h"><button class="icon-btn"${act(nav, -1)}${prevDis ? ' disabled' : ''} aria-label="上個月">${icon('chevron-left', 20, 3)}</button><span>${y}年${m}月</span><button class="icon-btn"${act(nav, 1)}${nextDis ? ' disabled' : ''} aria-label="下個月">${icon('chevron-right', 20, 3)}</button></div><div class="cal-g">${cells}</div></div>`;
}

// ================= 外框 =================
function badgeFor(s) {
  const u = U.user;
  switch (s) {
    case 'home': return outstandingSales(u).length;
    case 'checkout': return cartCount();
    case 'inventory': return isCompany() ? 0 : lowStockProducts(u).length;
    case 'bookings': return activeLoans(u).filter(l => { const st = dueState(l); return isOverdue(st) || isDueSoon(st); }).length;
    case 'costumes': return overdueLoans(u).length;
    default: return 0;
  }
}
function tabbar() {
  return `<nav class="tabbar" aria-label="主要功能">${tabsFor().map(s => { const b = badgeFor(s); return `<button class="tab${U.section === s ? ' on' : ''}"${act('tab', s)} aria-current="${U.section === s ? 'page' : 'false'}">${icon(SEC_ICON[s], 24, 2.2)}<span>${secShort(s)}</span>${b > 0 ? `<span class="bdg">${b}</span>` : ''}</button>`; }).join('')}</nav>`;
}
function sidebar() {
  const secs = sectionsFor(); const groups = unique(secs.map(s => SEC_GROUP[s])); const u = U.user;
  let h = `<aside class="sidebar"><div class="brand">Yumeverse<small>夢次元記帳・網頁測試版</small></div>`;
  for (const g of groups) {
    h += `<div class="side-group">${g}</div>`;
    for (const s of secs.filter(x => SEC_GROUP[x] === g)) {

      h += `<button class="side-item${U.section === s ? ' on' : ''}"${act('tab', s)}><span style="color:var(--pink)">${icon(SEC_ICON[s], 22)}</span>${esc(secTitle(s))}${b ? `<span class="bdg">${b}</span>` : ''}</button>`;
    }
  }
  const initial = isCompany() ? '公' : (coser(u.coserID)?.initial ?? 'C');
  h += `<div class="side-foot"><span class="avatar" style="width:38px;height:38px;border-radius:12px;background:var(--pink);color:#fff;font-size:17px">${esc(initial)}</span><div class="grow"><div class="heavy sub ellip">${esc(u.displayName)}</div><div class="cap soft">${isCompany() ? '公司' : 'Coser'}帳號</div></div></div></aside>`;
  return h;
}
function entryTitle(e) {
  if (!e) return secTitle(U.section);
  if (e.type === 'section') return secTitle(e.section);
  if (e.type === 'costume') return costumeByID(e.id)?.code ?? '服裝';
  if (e.type === 'loan') return '借用明細';
  if (e.type === 'member') return '會員';
  return '';
}
function currentContent() {
  const top = U.stack[U.stack.length - 1];
  let r;
  if (!top) r = sectionView(U.section);
  else if (top.type === 'section') r = sectionView(top.section);
  else if (top.type === 'costume') r = viewCostumeDetail(top.id);
  else if (top.type === 'loan') r = viewLoanDetail(top.id);
  else r = viewMemberDetail(top.id);
  r.key = top ? `${top.type}-${top.id || top.section}` : U.section;
  if (top) r.backLabel = entryTitle(U.stack[U.stack.length - 2]);
  return r;
}
function sectionView(s) {
  switch (s) {
    case 'home': return isCompany() ? viewCompanyHome() : viewCoserHome();
    case 'checkout': return viewCheckout();
    case 'reconcile': return viewReconcile();
    case 'costumes': return viewCostumes();
    case 'records': return viewRecords();
    case 'bookings': return viewBookings();
    case 'inventory': return viewProducts();
    case 'mySales': return viewSalesHistory();
    case 'members': return viewMembers();
    case 'cosers': return viewRoster();
    default: return viewMore();

}

  const recent = daySales.slice(0, 5);

    `<div class="tiles">${tiles}</div>`, ranking,

    card(stitle('待處理') + todoHtml),
    card(`<div class="row">${stitle('最近交易')}${link('看全部', 'jump', 'reconcile')}</div>` + (recent.length ? joinRows(recent, x => saleRow(x)) : empty('inbox', cid == null ? `${dn}還沒有交易` : `${dn}還沒有 ${sc?.shortName ?? ''} 的交易`)))

const todoRow = (ic, t, d, fg) => `<span class="todo" style="--fg:${fg}"><span class="tic">${icon(ic, 20)}</span><span class="grow" style="text-align:left"><b>${esc(t)}</b><span class="cap soft">${esc(d)}</span></span><span class="soft">${icon('chevron-right', 16, 3)}</span></span>`;
function paymentBreakdown(s) {
  const rows = [['現金', s.byMethod.cash || 0, PAY.cash.fg], ['轉帳', s.byMethod.transfer || 0, PAY.transfer.fg], ['LINE Pay', s.byMethod.linePay || 0, PAY.linePay.fg]];
  if ((s.byMethod.recorded || 0) > 0) rows.push(['現場表已收（方式未記）', s.byMethod.recorded, PAY.recorded.fg]);
  rows.push(['賒帳待收', s.outstanding, PAY.credit.fg]);
  const total = Math.max(1, rows.reduce((n, r) => n + r[1], 0));
  return stitle('收款方式') + rows.map(([t, a, fg]) => `<div class="stack" style="gap:4px"><div class="row"><span class="grow bold sub">${esc(t)}</span><b class="sub num">${money(a, s.currency)}</b></div><div class="bar" style="--fg:${fg}"><i style="width:${a === 0 ? 0 : Math.max(2, a / total * 100)}%"></i></div></div>`).join('');
}

// 記帳由各 Coser 負責：記帳畫面就是登入的 Coser 自己的商品；公司沒有記帳（2026-10-21）
const activeCheckoutCoser = () => (U.user && U.user.role !== 'company') ? U.user.coserID : null;
// 今日菜單幣別（記帳的 Coser、選的日期）；公司沒有記帳，固定台幣
const menuCurrency = () => menuCurrencyOf(activeCheckoutCoser(), selDay());
const mmoney = a => money(a, menuCurrency());
// 首頁、對帳、我的銷售：一天有好幾種幣別時可以切換（不換算、不相加）
function reportCurrency(cid = null) { const l = currenciesOnDay(selDay(), U.user, cid); return U.reportCur && l.includes(U.reportCur) ? U.reportCur : currencyOnDay(selDay(), U.user, cid); }
function currencySwitch(cid = null) {
  const l = currenciesOnDay(selDay(), U.user, cid); if (l.length < 2) return '';
  const cur = reportCurrency(cid);
  return `<div class="stack g8"><div class="row g8 wrap">${l.map(c => chip(`${CUR[c].label} ${CUR[c].symbol}`, c === cur, 'reportCur', c)).join('')}</div><div class="cap bold soft">這天有 ${l.length} 種幣別，各自合計、不換算也不相加。</div></div>`;
}
function viewCheckout() {
  const u = U.user, cid = activeCheckoutCoser();
  const themes = cid ? visibleThemes(u).filter(t => t.coserID === cid) : [];
  // 同系列排在一起，系列裡先寫真集、再周邊；停售的不顯示
  const items = themes.flatMap(t => ['photobook', 'goods'].flatMap(k => sellableIn(t.id, k).map(p => ({ p, t }))));
  const body = items.length ? `<div class="tile-grid">${items.map(({ p, t }) => productTile(p, t)).join('')}</div>`
    : card(`<div class="stack center" style="padding:20px 0;gap:10px"><span style="color:var(--pink-light)">${icon('shopping-bag', 44)}</span><b style="font-size:18px">還沒有商品</b><span class="sub soft">先到「商品」新增你的寫真集或周邊，就可以在這裡記帳。</span><button class="cbtn"${act('tab', 'inventory')}>去新增商品</button></div>`);
  const left = `<div class="stack g8" style="min-width:0">${compactDay()}${testNotice()}${body}</div>`;
  // 寬螢幕：購物車空的時候不顯示，加入商品後才出現
  // 外層固定不變，購物車出現時才放進右欄；格子用 FLIP 動畫平順地從 6 欄變 4 欄
  // 收款畫面開著時購物車先留著，關掉後才滑出去，看得到格子放大回 6 欄
  const showCart = U.cart.length > 0 || U.sheet?.type === 'payment';
  if (isWide()) return { title: '記帳', cls: 'fullw', html: `<div class="checkout-grid${showCart ? '' : ' nocart'}" id="checkout-grid">${left}${showCart ? cartPanel() : ''}</div>` };
  const after = cartCount() > 0 ? `<div class="cartbar"><button class="btn primary"${act('openPayment')}><span class="n num">${cartCount()} 件</span><span class="num grow" style="text-align:left">${mmoney(cartTotal(U.cart))}</span><span>前往收款</span>${icon('chevron-right', 20, 3)}</button></div>` : '';

/** 一格商品：上面品名、下面深色條寫價格；點格子 +1，右上角數量圓點 -1 */
function productTile(p, t) {
  const cur = menuCurrency(), unit = priceIn(p, cur);
  const qty = qtyInCart(p.id), sold = !p.digital && p.stock != null && p.stock <= 0, locked = unit == null || sold;
  const hex = locked ? 'CFC7BF' : t.tintHex, bar = shadeHex(hex);
  // 未盤點（庫存空白）不當成 0，也不當成有庫存，照實寫「未盤點」
  // 未盤點（庫存空白）不當成 0，也不顯示庫存數字；格子空間小，「未盤點」標在「我的商品」與提示裡
  const status = sold ? '已售完' : (isLowStock(p) && p.stock != null ? `剩 ${p.stock}` : '');
  const price = money(unit, cur);
  return `<div class="ptile-wrap${qty ? ' has' : ''}" id="tile-${esc(p.id)}" data-flip="${esc(p.id)}"><button class="ptile${qty ? ' has' : ''}${Object.hasOwn(PHOTOS, p.id) ? ` ph ph-${esc(p.id)}` : ''}" style="--pbg:#${hex};--pink-on:${readableInk(hex)};--pbar:#${bar};--pbar-on:${readableInk(bar)}"${act('addCart', p.id)}${locked ? ' disabled' : ''} aria-label="${esc([p.name, price, status].filter(Boolean).join('，'))}"><span class="pn">${esc(p.name)}</span><span class="pb">${status ? `<i>${status}</i>` : ''}<b>${price}</b></span></button>${qty ? `<button class="pbadge"${act('qty', p.id, -1)} aria-label="減少 1 件 ${esc(p.name)}，目前 ${qty} 件">${qty}</button>` : ''}</div>`;
}
function shadeHex(hex, f = 0.78) {
  const v = parseInt(hex, 16); const c = x => Math.round(x * f).toString(16).padStart(2, '0');
  return (c((v >> 16) & 255) + c((v >> 8) & 255) + c(v & 255)).toUpperCase();
}

function bootHost() {
  document.body.classList.add('host');

  try { cur = localStorage.getItem('yv-device'); } catch (e) { /* 不能存就用預設 */ }
  if (!DEVICES[cur]) cur = window.innerWidth >= 900 ? 'ipad' : 'iphone';

  app.innerHTML = `<div class="host-wrap">
    <header class="host-bar"><div class="host-title"><b>Yumeverse 夢次元記帳</b><span>測試版・選擇要模擬的裝置</span></div>

    <p class="host-note" id="host-note"></p></div>`;
  const frame = document.getElementById('frame');
  // 目前的登入、購物車與記帳資料：切換裝置時交給新的畫面（這個分頁關掉才清掉）
  let hostState = null;
  try { hostState = sessionStorage.getItem('yv-state'); } catch (e) { /* 不能存就只放記憶體 */ }
  window.addEventListener('message', e => {
    if (e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === 'yv-hello') frame.contentWindow.postMessage({ type: 'yv-restore', state: hostState }, '*');
    else if (e.data.type === 'yv-state' && typeof e.data.state === 'string') {
      hostState = e.data.state;
      try { sessionStorage.setItem('yv-state', hostState); } catch (err) { /* 只放記憶體 */ }
    }
  });
  document.getElementById('host-reset').addEventListener('click', () => {

  function tick() { const d = new Date(); document.getElementById('sbar-time').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function fit() {

    const stage = document.getElementById('host-stage');
    const availW = stage.clientWidth - 8;
    const availH = Math.max(320, window.innerHeight - stage.getBoundingClientRect().top - 56);
    const s = Math.min(1, availW / W, availH / H);
    const box = document.getElementById('device-box');
    box.style.width = `${W * s}px`; box.style.height = `${H * s}px`;
    document.getElementById('device').style.transform = `scale(${s})`;
    document.getElementById('host-note').textContent = `${d.note}・目前縮放 ${Math.round(s * 100)}%・切換裝置會保留目前的登入、購物車與記帳資料。`;
  }
  function select(k) {
    cur = k; const d = DEVICES[k];

    const dev = document.getElementById('device');
    dev.className = `device ${k.startsWith('ipad') ? 'is-ipad' : 'is-iphone'}`;
    Object.assign(dev.style, { width: `${d.w + d.bezel * 2}px`, height: `${d.h + d.bezel * 2}px`, padding: `${d.bezel}px`, borderRadius: `${d.radius}px` });
    dev.querySelector('.screen').style.borderRadius = `${d.radius - d.bezel}px`;
    document.getElementById('sbar').style.height = `${d.status}px`;
    document.getElementById('homebar').style.height = `${d.home}px`;
    frame.style.height = `${d.h - d.status - d.home}px`;
    frame.src = deviceURL(k);
    document.getElementById('host-full').href = deviceURL('full');
    fit();
  }
  document.querySelector('.host-seg').addEventListener('click', e => { const b = e.target.closest('[data-dev]'); if (b && b.dataset.dev !== cur) select(b.dataset.dev); });
  window.addEventListener('resize', fit);

  select(cur);
}

  if (i >= 0) { U.cart[i].quantity += d; if (U.cart[i].quantity <= 0) U.cart.splice(i, 1); }
  else if (d > 0) U.cart.push({ productID: id, quantity: d });
}

function openProductForm(pid, tid) {
  const themes = visibleThemes(U.user);
  const used = new Set(themes.map(t => t.tintHex));
  const sh = { type: 'product', productID: pid || null, seriesID: null, newWork: '', newCharacter: '', newTint: PALETTE.find(h => !used.has(h)) || PALETTE[themes.length % PALETTE.length], kind: 'photobook', name: '', prices: { TWD: '', HKD: '', JPY: '', USD: '' }, stock: '', digital: false };
  const p = pid ? productByID(pid) : null;
  if (p) Object.assign(sh, { seriesID: p.themeID, kind: p.kind, name: p.name, prices: Object.fromEntries(CURRENCIES.map(c => [c, priceIn(p, c) != null ? String(priceIn(p, c)) : ''])), stock: p.stock != null ? String(p.stock) : '', digital: p.digital });
  else if (tid) sh.seriesID = tid;
  else if (!themes.length) sh.seriesID = 'new';
  U.sheet = sh;
}

const APP = document.getElementById('app');
let composing = false, focusAfter = null;
// ================= 切換裝置時保留狀態 =================
// 外框頁（選 iPhone／iPad）負責保管；App 每次畫面更新後把目前的資料與畫面狀態交給外框。
const IN_FRAME = !!DEVICE && DEVICE !== 'full' && window.parent !== window;
const STATE_VERSION = 3; // 10/22 補測試售價後 +1；10/27 多幣別、Coser 名冊後再 +1，舊的暫存狀態不再沿用
const KEEP_UI = ['user', 'dataset', 'section', 'stack', 'sheet', 'pickedDay', 'cart', 'cartMember', 'cartDebtor', 'homeCoserID', 'reportCur',
  'costumeFilter', 'locationFilter', 'costumeSearch', 'recordsKind', 'recordsTab', 'recordsSearch', 'venueDay', 'showPast', 'themeFilter', 'memberSearch'];
function snapshotState() {
  const ui = {}; for (const k of KEEP_UI) ui[k] = U[k];
  if (ui.sheet?.type === 'feedback') ui.sheet = null;
  return JSON.stringify({ v: STATE_VERSION, S: { ...S, sales: { ...S.sales, memberCard: [...S.sales.memberCard] } }, U: ui });
}
function restoreState(json) {
  try {
    const o = JSON.parse(json);
    if (!o || o.v !== STATE_VERSION) return false;
    Object.assign(S, o.S);
    S.sales.memberCard = new Set(o.S.sales.memberCard || []);
    syncPeople();
    for (const k of KEEP_UI) if (k in o.U) U[k] = o.U[k];
    U.sideCollapsed = U.section === 'checkout' && !U.stack.length;
    U.confirm = null; U.toast = null;
    return true;
  } catch (e) { return false; }
}
let snapTimer = null;
function queueSnapshot() {
  if (!IN_FRAME) return;
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => { try { window.parent.postMessage({ type: 'yv-state', state: snapshotState() }, '*'); } catch (e) { /* 外框收不到就算了 */ } }, 150);
}

// ================= 動畫：格子位置改變時平順移動（FLIP） =================
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function captureTiles() {
  if (REDUCED_MOTION) return null;
  const tiles = document.querySelectorAll('[data-flip]');
  if (!tiles.length) return null;
  const map = new Map();
  tiles.forEach(el => map.set(el.dataset.flip, el.getBoundingClientRect()));
  return map;
}
function playFlip(before) {
  if (!before) return;
  document.querySelectorAll('[data-flip]').forEach(el => {
    const a = before.get(el.dataset.flip); if (!a) return;
    const b = el.getBoundingClientRect();
    // 只移動位置、不拉伸，字不會變形；格子大小直接換成新的
    const dx = a.left - b.left, dy = a.top - b.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    el.animate([
      { transform: `translate(${dx}px, ${dy}px)`, opacity: 0.6 },
      { transform: 'none', opacity: 1 }
    ], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
  });
}
/** 購物車收回時先滑出去再移除，不會一下子消失 */
function slideOutCartPanel(node) {
  if (REDUCED_MOTION || !node.isConnected) return true;
  const grid = node.parentNode; const rect = node.getBoundingClientRect(); const gridRect = grid.getBoundingClientRect();
  node.classList.add('leaving');
  Object.assign(node.style, { top: `${rect.top - gridRect.top}px`, width: `${rect.width}px` });
  node.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(60px)', opacity: 0 }], { duration: 260, easing: 'ease-in' })
    .finished.then(() => node.remove(), () => node.remove());
  return false;
}

function render() {
  if (HOST_MODE) return;
  const flip = captureTiles();
  const html = (U.user ? viewShell() : viewLogin()) + (U.sheet ? viewSheet() : '') + (U.confirm ? viewConfirm() : '')
    + (U.toast ? `<div class="toast t-${U.toast.kind}" id="toast-${U.toast.id}" role="status"${act('toastClose')}>${icon(U.toast.kind === 'success' ? 'circle-check' : U.toast.kind === 'failure' ? 'circle-x' : 'info', 22, 2.4)}<span>${esc(U.toast.text)}</span></div>` : '');
  if (window.morphdom) {
    morphdom(APP, `<div id="app">${html}</div>`, {
      onBeforeElUpdated(from, to) {
        if (from === document.activeElement && (from.tagName === 'INPUT' || from.tagName === 'TEXTAREA')) { from.className = to.className; return false; }
        return !from.isEqualNode(to);
      },
      onBeforeNodeDiscarded(node) {
        if (node.id === 'cart-panel' && node.parentNode?.id === 'checkout-grid') return slideOutCartPanel(node);
        return true;
      }
    });
  } else APP.innerHTML = html;
  playFlip(flip);
  queueSnapshot();
  document.body.classList.toggle('lock', !!(U.sheet || U.confirm));
  if (wantScrollTop) { wantScrollTop = false; window.scrollTo(0, 0); }
  if (focusAfter) { const el = document.getElementById(focusAfter); focusAfter = null; if (el) el.focus(); }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const name = el.dataset.a;
  if (name === 'noop') return;
  if (el.tagName === 'BUTTON') e.preventDefault();
  e.stopPropagation();
  const fn = A[name]; if (!fn) return;
  fn(el.dataset.p, el.dataset.q);
  render();
});
document.addEventListener('compositionstart', () => { composing = true; });
document.addEventListener('compositionend', e => { composing = false; onInput(e); });
function onInput(e) {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  let v = el.value;
  if (el.dataset.num) { const d = v.replace(/\D/g, ''); if (d !== v) { el.value = d; v = d; } }
  setBind(el.dataset.bind, v);
  if (el.dataset.bind.startsWith('login.')) U.login.error = null;
  if (U.sheet?.type === 'feedback') U.sheet.sent = false;
  if (!composing) render();
}
document.addEventListener('input', onInput);
// 合約照片：拍照或選相簿，縮到長邊 1600px 的 JPEG（只存在這個瀏覽器分頁）
function shrinkImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => resolve(null);
      img.src = reader.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}
document.addEventListener('change', async e => {
  const el = e.target; if (!el.dataset?.photos || !el.files?.length) return;
  const target = el.dataset.photos, files = [...el.files]; el.value = '';
  const srcs = (await Promise.all(files.map(shrinkImage))).filter(Boolean);
  if (!srcs.length) { show('failure', '讀不到這張照片，請換一張再試。'); render(); return; }
  if (target === 'register' && U.sheet?.type === 'register') U.sheet.form.photos.push(...srcs.map(src => ({ id: 'ph-' + rid() + nowMs().toString(36), src })));
  else if (target === 'profile' && U.sheet?.type === 'profile') perform(() => addContractPhotos(U.sheet.id, srcs, U.user), `已加入 ${srcs.length} 頁合約照片`);
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (U.confirm) U.confirm = null; else if (U.sheet) U.sheet = null; else return; render(); return; }
  if (e.key === 'Enter' && !e.isComposing && e.target.dataset?.enter) { e.preventDefault(); A[e.target.dataset.enter](); render(); }
});
window.matchMedia('(min-width: 768px)').addEventListener('change', render);
// 跨日、時段過期：每分鐘重畫一次（沒有開彈出畫面時）
setInterval(() => { if (!U.sheet && !document.activeElement?.dataset?.bind) render(); }, 60000);

if (HOST_MODE) bootHost();
else {
resetData(U.dataset);
if (IN_FRAME) {
  // 在裝置外框裡：先跟外框要上一個裝置的狀態，拿到就接著用；0.4 秒沒回應就從頭開始
  let started = false;
  const start = () => { if (!started) { started = true; render(); } };
  window.addEventListener('message', e => {
    if (e.source !== window.parent || !e.data || e.data.type !== 'yv-restore') return;
    if (e.data.state) restoreState(e.data.state);
    started = false; start();
  });
  window.parent.postMessage({ type: 'yv-hello' }, '*');
  setTimeout(start, 400);
} else render();

// 意見回饋：有共用資料庫時才出現
(async () => {
  try {
    const db = await window.claude?.use?.('db');
    if (!db) return;
    FB.db = db;
    db.collection('feedback').orderBy('at', 'desc').limit(50).onSnapshot(snap => { FB.items = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
    render();
  } catch (e) { /* 沒有回饋功能也可以正常使用 */ }
})();
}

</script>
